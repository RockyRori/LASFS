dataset:
  name: bank
  source:
    type: openml
    data_id: 1461
  target: Class
  task_description: Predict whether a bank client will subscribe to a term deposit.
  feature_descriptions:
    V1: Client age.
    V2: Client job type.
    V3: Client marital status.
    V4: Client education level.
    V5: Whether the client has credit in default.
    V6: Average yearly account balance.
    V7: Whether the client has a housing loan.
    V8: Whether the client has a personal loan.
    V9: Contact communication type.
    V10: Last contact day of the month.
    V11: Last contact month of year.
    V12: Last contact duration in seconds.
    V13: Number of contacts during this campaign.
    V14: Days since last contact from a previous campaign.
    V15: Number of contacts before this campaign.
    V16: Outcome of the previous marketing campaign.

split:
  train_size: 0.6
  validation_size: 0.2
  test_size: 0.2
  seeds: [1, 2, 3, 4, 5]

feature_selection:
  k_ratio: 0.4
  alpha: 0.6
  beta: 0.4
  lambda_1: 0.5
  lambda_2: 0.3
  lambda_3: 0.2

model:
  type: random_forest
  n_estimators: 300

llm:
  provider: deepseek
  model: deepseek-chat
  temperature: 0
  prompt_variants:
    - semantic_leakage_scoring
    - semantic_leakage_scoring_auditor
    - semantic_leakage_scoring_deployment

leakage_injection:
  obvious_count: 2
  disguised_count: 1
  noise: 0.05
  seed: 42

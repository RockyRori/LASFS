extends: common/llm.yaml

dataset:
  name: adult
  source:
    type: openml
    name: adult
    version: 2
  target: class
  task_description: Predict whether a person's income exceeds 50K.

split:
  train_size: 0.6
  validation_size: 0.2
  test_size: 0.2
  seeds: [1, 2, 3, 4, 5]

feature_selection:
  k_ratio: 0.4
  alpha: 0.6
  beta: 0.4
  lambda_1: 0.5
  lambda_2: 0.3
  lambda_3: 0.2

model:
  type: random_forest
  n_estimators: 300

leakage_injection:
  feature_count: 10
  level_counts:
    strong: 3
    moderate: 4
    weak: 3
  noise_by_level:
    strong: 0.02
    moderate: 0.15
    weak: 0.35
  seed: 42

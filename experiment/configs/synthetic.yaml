extends: common/llm.yaml

dataset:
  name: synthetic
  source:
    type: synthetic
    n_samples: 400
    n_numeric: 6
    n_categorical: 3
  target: target
  task_description: Predict whether a synthetic customer will have a positive outcome.

split:
  train_size: 0.6
  validation_size: 0.2
  test_size: 0.2
  seeds: [1, 2]

feature_selection:
  k_ratio: 0.4
  alpha: 0.6
  beta: 0.4
  lambda_1: 0.5
  lambda_2: 0.3
  lambda_3: 0.2

model:
  type: random_forest
  n_estimators: 120

leakage_injection:
  feature_count: 10
  level_counts:
    strong: 3
    moderate: 4
    weak: 3
  noise_by_level:
    strong: 0.02
    moderate: 0.15
    weak: 0.35
  seed: 42

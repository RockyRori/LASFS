[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lasfs-tabular"
version = "0.1.0"
description = "LLM-assisted leakage-aware feature selection for trustworthy tabular prediction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "LASFS Contributors" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pytest>=8.0",
  "jupyter>=1.0"
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
dev = ["ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
